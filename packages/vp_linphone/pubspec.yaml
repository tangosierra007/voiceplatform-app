name: vp_linphone
description: "VoicePlatform SIP engine on liblinphone: implements CallEngine (contracts/call_engine.dart). Android only for now."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  call_engine:
    path: ../call_engine
  flutter:
    sdk: flutter

dev_dependencies:
  archive: ^4.5.2
  crypto: ^3.0.8
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: au.com.voiceplatform.vp_linphone
        pluginClass: VpLinphonePlugin
  # Licence texts of the native code in the liblinphone SDK, for the in-app
  # licence list (addVpLinphoneLicenses) and NOTICE.
  assets:
    - licenses/bctoolbox/
    - licenses/belle-sip/
    - licenses/belr/
    - licenses/bzrtp/
    - licenses/dav1d/
    - licenses/jsoncpp/
    - licenses/libc++/
    - licenses/libjpeg-turbo/
    - licenses/liblinphone/
    - licenses/liboqs/
    - licenses/libsrtp/
    - licenses/libvpx/
    - licenses/libxml2/
    - licenses/lime/
    - licenses/mbedtls/
    - licenses/mediastreamer2/
    - licenses/msaaudio/
    - licenses/msandroidcamera2/
    - licenses/mswebrtc/
    - licenses/mswebrtc-abseil/
    - licenses/mswebrtc-ooura/
    - licenses/openldap/
    - licenses/opus/
    - licenses/ortp/
    - licenses/postquantumcryptoengine/
    - licenses/soci/
    - licenses/speex/
    - licenses/sqlite/
