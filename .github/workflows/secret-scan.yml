name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1
      - name: Refuse key and service account files
        run: |
          bad=$(git ls-files | grep -Ei '(\.jks|\.keystore|\.p8|\.p12|\.mobileprovision|key\.properties|(^|/)\.env(\..*)?|service-account.*\.json|voiceplatform-app-[0-9a-f]+\.json|firebase-push-.*\.json|play-upload-.*\.json)$' || true)
          if [ -n "$bad" ]; then echo "Key or secret files are tracked:"; echo "$bad"; exit 1; fi