name: secret-scan

on:
  push:
  pull_request:
    # edited: phone-numbers reads the pull request title and description.
    # labeled, unlabeled: phone-numbers reads the phone-check-approved label.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  gitleaks:
    # Title, description and label changes change no code; only
    # phone-numbers reruns.
    if: ${{ !contains(fromJSON('["edited", "labeled", "unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        # The config is always the default branch's .gitleaks.toml (or the
        # built-in rules if it has none), never the scanned tree's copy: a
        # branch or pull request cannot allow-list a secret it adds, and a
        # branch cut before the config landed still gets main's allow-list for
        # main's commits (gitleaks scans every ref). It is copied to
        # RUNNER_TEMP, mounted read-only and passed with --config.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          if git show "origin/$DEFAULT_BRANCH:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks/config.toml" 2>/dev/null; then
            echo "gitleaks config: .gitleaks.toml from origin/$DEFAULT_BRANCH"
          else
            # Still pass a config (the built-in rules only), so gitleaks never
            # falls back to the scanned tree's .gitleaks.toml.
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks/config.toml"
            echo "gitleaks config: built-in default rules (origin/$DEFAULT_BRANCH has no .gitleaks.toml)"
          fi
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/gitleaks:/config:ro" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /config/config.toml --redact --verbose --exit-code 1
      - name: Refuse key and service account files
        run: |
          bad=$(git ls-files | grep -Ei '(\.jks|\.keystore|\.p8|\.p12|\.mobileprovision|key\.properties|(^|/)\.env(\..*)?|service-account.*\.json|voiceplatform-app-[0-9a-f]+\.json|firebase-push-.*\.json|play-upload-.*\.json)$' || true)
          if [ -n "$bad" ]; then echo "Key or secret files are tracked:"; echo "$bad"; exit 1; fi
      - name: Refuse commit identities outside the allowed domains
        # Authors and committers must be GitHub noreply addresses or milavo.com.au.
        # Merge commits are skipped: GitHub's own pull request merge ref is one,
        # authored with the account's email. The log is public, so it names a
        # refused commit by its short hash only, never the address.
        run: |
          allowed='^([^@]+@users\.noreply\.github\.com|[^@]+@milavo\.com\.au|noreply@github\.com)$'
          bad=0
          while read -r hash author committer; do
            if ! [[ "$author" =~ $allowed && "$committer" =~ $allowed ]]; then
              echo "$hash: author or committer email not allowed"
              bad=1
            fi
          done < <(git log --all --no-merges --format='%h %ae %ce' | tr 'A-Z' 'a-z')
          exit $bad

  phone-numbers:
    # Fails on any Australian phone number outside ACMA's fictional numbers
    # (tool/check_phone_numbers.dart; README.md, Test data): in tracked
    # files, in the commit messages and added lines of the pushed or pull
    # request range, and in the pull request title and description. Hits are
    # printed masked (04xx xxx 123), never in full.
    #
    # The check and its allow-list run from the default branch, never from
    # the scanned branch, so a pull request cannot weaken its own check. A
    # pull request that changes them fails unless it has the
    # phone-check-approved label (added by the project lead only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.8" # as FLUTTER_VERSION in android.yml
          channel: stable
          cache: true
      - name: Take the check and its allow-list from the default branch
        # Like the gitleaks config. Only while the default branch has no copy
        # yet (the pull request that adds this job) are the branch's own
        # script and allow-list used; that pull request changes the check, so
        # it also needs the phone-check-approved label below.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          dir="$RUNNER_TEMP/phone"
          mkdir -p "$dir/tool"
          : > "$RUNNER_TEMP/phone-allow.txt"
          if git cat-file -e "origin/$DEFAULT_BRANCH:tool/check_phone_numbers.dart" 2>/dev/null &&
             git cat-file -e "origin/$DEFAULT_BRANCH:tool/phone_numbers" 2>/dev/null; then
            git archive "origin/$DEFAULT_BRANCH" tool/check_phone_numbers.dart tool/phone_numbers | tar -x -C "$dir"
            if [ -f "$dir/tool/phone_numbers/allow_list.txt" ]; then
              cp "$dir/tool/phone_numbers/allow_list.txt" "$RUNNER_TEMP/phone-allow.txt"
            fi
            echo "Phone number check: from origin/$DEFAULT_BRANCH"
          else
            cp -r tool/check_phone_numbers.dart tool/phone_numbers "$dir/tool/"
            cp "$dir/tool/phone_numbers/allow_list.txt" "$RUNNER_TEMP/phone-allow.txt"
            echo "Phone number check: from this branch, allow-list included (origin/$DEFAULT_BRANCH has none yet)"
          fi
      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            # A new branch, or a force push whose old head is gone.
            range="origin/$DEFAULT_BRANCH..$SHA"
          fi
          echo "Commit range: $range"
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: Write the pull request title and description
        # Straight from the event file to files. Never through env or echo:
        # Actions prints a step's env in the log.
        if: github.event_name == 'pull_request'
        run: |
          jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-title.txt"
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.txt"
      - name: Check for real Australian phone numbers
        env:
          RANGE: ${{ steps.range.outputs.range }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--allow "$RUNNER_TEMP/phone-allow.txt" --tree --commits "$RANGE")
          if [ "$EVENT" = pull_request ]; then
            args+=(--text "pull request title=$RUNNER_TEMP/pr-title.txt")
            args+=(--text "pull request description=$RUNNER_TEMP/pr-body.txt")
          fi
          dart "$RUNNER_TEMP/phone/tool/check_phone_numbers.dart" "${args[@]}"
      - name: Changes to the check need the phone-check-approved label
        # Runs even when the scan failed, so both results show.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'phone-check-approved') }}
        run: |
          changed=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- \
            tool/check_phone_numbers.dart tool/phone_numbers .github/workflows/secret-scan.yml)
          if [ -z "$changed" ]; then
            echo "The phone number check is unchanged."
          elif [ "$APPROVED" = true ]; then
            echo "The phone number check changes; approved by the phone-check-approved label:"
            echo "$changed"
          else
            echo "::error title=Phone number check changed::This pull request changes the phone number check. It needs the phone-check-approved label from the project lead."
            echo "$changed"
            exit 1
          fi
