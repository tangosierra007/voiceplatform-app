name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1
      - name: Refuse key and service account files
        run: |
          bad=$(git ls-files | grep -Ei '(\.jks|\.keystore|\.p8|\.p12|\.mobileprovision|key\.properties|(^|/)\.env(\..*)?|service-account.*\.json|voiceplatform-app-[0-9a-f]+\.json|firebase-push-.*\.json|play-upload-.*\.json)$' || true)
          if [ -n "$bad" ]; then echo "Key or secret files are tracked:"; echo "$bad"; exit 1; fi
      - name: Refuse commit identities outside the allowed domains
        # Authors and committers must be GitHub noreply addresses or milavo.com.au.
        # Merge commits are skipped: GitHub's own pull request merge ref is one,
        # authored with the account's email. The log is public, so a refused
        # address is shown by its domain only.
        run: |
          bad=$(git log --all --no-merges --format='%ae%n%ce' | sort -u \
            | grep -viE '^([^@]+@users\.noreply\.github\.com|[^@]+@milavo\.com\.au|noreply@github\.com)$' || true)
          if [ -n "$bad" ]; then
            echo "Commit identities not allowed (domains shown):"
            echo "$bad" | sed 's/^[^@]*@/***@/' | sort -u
            exit 1
          fi