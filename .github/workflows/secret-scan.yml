name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        # gitleaks scans every ref (git log --all) but reads .gitleaks.toml
        # from the checked-out tree. A branch cut before the config landed
        # would scan main's commits without main's allow-list and fail, so
        # such a branch uses the default branch's file. The config is always
        # passed by --config, never found by chance.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cfg=""
          if [ -f .gitleaks.toml ]; then
            cfg=/repo/.gitleaks.toml; echo "gitleaks config: .gitleaks.toml from this commit"
          elif git show "origin/$DEFAULT_BRANCH:.gitleaks.toml" > .git/gitleaks-default.toml 2>/dev/null; then
            cfg=/repo/.git/gitleaks-default.toml; echo "gitleaks config: .gitleaks.toml from origin/$DEFAULT_BRANCH"
          else
            rm -f .git/gitleaks-default.toml; echo "gitleaks config: built-in default rules"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo ${cfg:+--config "$cfg"} --redact --verbose --exit-code 1
      - name: Refuse key and service account files
        run: |
          bad=$(git ls-files | grep -Ei '(\.jks|\.keystore|\.p8|\.p12|\.mobileprovision|key\.properties|(^|/)\.env(\..*)?|service-account.*\.json|voiceplatform-app-[0-9a-f]+\.json|firebase-push-.*\.json|play-upload-.*\.json)$' || true)
          if [ -n "$bad" ]; then echo "Key or secret files are tracked:"; echo "$bad"; exit 1; fi
      - name: Refuse commit identities outside the allowed domains
        # Authors and committers must be GitHub noreply addresses or milavo.com.au.
        # Merge commits are skipped: GitHub's own pull request merge ref is one,
        # authored with the account's email. The log is public, so it names a
        # refused commit by its short hash only, never the address.
        run: |
          allowed='^([^@]+@users\.noreply\.github\.com|[^@]+@milavo\.com\.au|noreply@github\.com)$'
          bad=0
          while read -r hash author committer; do
            if ! [[ "$author" =~ $allowed && "$committer" =~ $allowed ]]; then
              echo "$hash: author or committer email not allowed"
              bad=1
            fi
          done < <(git log --all --no-merges --format='%h %ae %ce' | tr 'A-Z' 'a-z')
          exit $bad