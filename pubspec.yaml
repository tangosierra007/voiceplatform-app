name: voiceplatform_app
description: "VoicePlatform phone and desktop app"
publish_to: 'none'

# versionName+versionCode on Android. Sent as `X-VP-App: android/<version>`.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Every dependency is listed with its licence in NOTICE.
dependencies:
  flutter:
    sdk: flutter
  call_engine:
    path: packages/call_engine
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.2
  retrofit: ^4.10.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  app_links: ^7.2.2
  android_intent_plus: ^6.1.0
  flutter_zxing: ^3.1.0
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.2
  swagger_parser: ^1.45.0
  fake_async: ^1.3.3
  yaml: ^3.1.3
  pigeon: ^29.0.11

flutter:
  uses-material-design: true

  # The fonts' licences, registered with LicenseRegistry for Open source licences.
  assets:
    - assets/fonts/unbounded/OFL.txt
    - assets/fonts/manrope/OFL.txt

  # Bundled from github.com/google/fonts (OFL-1.1); never fetched at run time.
  # Both are variable fonts: the theme sets the wght axis with FontVariation.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded/Unbounded-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Variable.ttf
